<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link href="styles.css" rel="stylesheet" />
    </head>

    <body>
        <!-- <h2>Lamλda Calculus</h2> -->

        <div id="main">
            <div id="mainExpand">
                <div id="mainExpandMenu">
                    <button id="undo">
                        <svg width="22" height="21" viewBox="0 0 22 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M8.09731 11.5L2.2973 6.50003L8.09731 1.50003M2.2973 6.50003H7.30206C14.4818 6.50003 20.3021 12.3203 20.3021 19.5"
                                stroke="black"
                                stroke-width="3"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>
                    <button id="redo">
                        <svg width="22" height="21" viewBox="0 0 22 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M13.7048 11.5L19.5048 6.50003L13.7048 1.50003M19.5048 6.50003H14.5C7.3203 6.50003 1.5 12.3203 1.5 19.5"
                                stroke="black"
                                stroke-width="3"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>
                    <div>
                        <input type="checkbox" id="resizeCheckbox" style="display: none" />
                        <label for="resizeCheckbox" id="resizeLabel">Expand</label>
                    </div>
                </div>
                <div id="lambdaView"></div>
            </div>
            <div id="sidebar">
                <div id="varNameWrapper">
                    <label for="varName">Variable Name:</label>
                    <input id="varName" maxlength="1" placeholder="a" />
                </div>
            </div>
        </div>

        <p id="lambdaTerm"></p>

        <div id="toggle" class="buttonList">
            <button id="showNames">Toggle Names</button>
            <button id="toggleLabels">Toggle Labels</button>
            <div>
                <select id="evalStrategy">
                    <option>Normal Order</option>
                    <option>Applicative Order</option>
                    <option>Call by Value</option>
                    <option>Call by Name</option>
                </select>
                <svg width="31" height="22" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 3L15.5 17.5L28 3" stroke="black" stroke-width="5" stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <div id="menu" class="buttonList">
            <button id="reset">
                <svg width="23" height="30" viewBox="0 0 23 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.5 2.50003L2.5 27.5" stroke="black" stroke-width="5" stroke-linecap="round" />
                    <path d="M20.2047 2.50003L5.70474 15L20.2047 27.5" stroke="black" stroke-width="5" stroke-linecap="round" />
                </svg>
            </button>

            <button id="back">
                <svg width="21" height="30" viewBox="0 0 21 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.3288 2.50003L3.82883 15L18.3288 27.5" stroke="black" stroke-width="5" stroke-linecap="round" />
                </svg>
            </button>

            <p id="index"></p>

            <button id="next">
                <svg width="21" height="30" viewBox="0 0 21 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.50003 2.50003L17 15L2.50003 27.5" stroke="black" stroke-width="5" stroke-linecap="round" />
                </svg>
            </button>

            <button id="totalReduce">
                <svg width="23" height="30" viewBox="0 0 23 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.2048 2.50003V27.5" stroke="black" stroke-width="5" stroke-linecap="round" />
                    <path d="M2.50006 2.50003L17.0001 15L2.50006 27.5" stroke="black" stroke-width="5" stroke-linecap="round" />
                </svg>
            </button>
        </div>

        <div id="acknowledgements">
            <a href="https://github.com/RamarkoB/lambda">Source Code</a> ⋅ Inspired by
            <a href="https://www.youtube.com/watch?v=RcVA8Nj6HEo">this 2swap video</a> and
            <a href="https://tromp.github.io/cl/diagrams.html">Tromp Diagrams</a>
        </div>

        <script src="main.js" defer></script>
    </body>
</html>
